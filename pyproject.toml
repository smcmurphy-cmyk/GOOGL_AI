[project]
name = "googl-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shawn", email = "smcmurphy@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.5",
