[project]
name = "googl-ai"
version = "0.1.0"
description = "Technical writing agent that is checked and verified before outputs."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "google-adk>=2.13.0",
    "google-genai>=2.34.0",
]

[project.scripts]
googl-ai = "googl_ai:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
